<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 428" role="img" aria-label="docker-layers">
<defs>
<marker id="ar0" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#D3D8CE"/></marker>
<marker id="ar1" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#1E4A39"/></marker>
<marker id="ar2" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#C2703C"/></marker>
<marker id="ar3" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#2E5878"/></marker>
</defs>
<text x="18" y="22" text-anchor="start" font-family="ui-monospace,monospace" font-size="11" fill="#6E7873" font-weight="normal">three different things, often confused</text>
<rect x="60" y="50" width="150" height="66" rx="5" fill="#F7F7F3" stroke="#1E4A39" stroke-width="1.4"/>
<text x="135" y="76" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" fill="#1C2421" font-weight="500">Dockerfile</text>
<text x="135" y="96" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">a recipe, in text</text>
<text x="135" y="132" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#1E4A39" font-weight="normal">you write it</text>
<rect x="270" y="50" width="150" height="66" rx="5" fill="#F7F7F3" stroke="#C2703C" stroke-width="1.4"/>
<text x="345" y="76" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" fill="#1C2421" font-weight="500">image</text>
<text x="345" y="96" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">a built, frozen filesystem</text>
<text x="345" y="132" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#C2703C" font-weight="normal">immutable, shareable</text>
<rect x="480" y="50" width="150" height="66" rx="5" fill="#F7F7F3" stroke="#2E5878" stroke-width="1.4"/>
<text x="555" y="76" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" fill="#1C2421" font-weight="500">container</text>
<text x="555" y="96" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">a running process on it</text>
<text x="555" y="132" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#2E5878" font-weight="normal">throw away, start again</text>
<line x1="214" y1="83" x2="264" y2="83" stroke="#6E7873" stroke-width="1.3" marker-end="url(#ar0)"/>
<text x="239.0" y="77.0" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">docker build</text>
<line x1="424" y1="83" x2="474" y2="83" stroke="#6E7873" stroke-width="1.3" marker-end="url(#ar0)"/>
<text x="449.0" y="77.0" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">docker run</text>
<text x="60" y="176" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#6E7873" font-weight="normal">The image is the unit you share. A container is just one execution of it, and nothing you</text>
<text x="60" y="192" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#C2703C" font-weight="normal">write inside a container survives unless it was on a mounted volume.</text>
<text x="18" y="232" text-anchor="start" font-family="ui-monospace,monospace" font-size="11" fill="#6E7873" font-weight="normal">an image is a stack of layers, and only the changed ones rebuild</text>
<rect x="60" y="252" width="420" height="26" rx="5" fill="#FFFFFF" stroke="#1E4A39" stroke-width="1.4"/>
<text x="72" y="270" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#1C2421" font-weight="normal">FROM  mambaorg/micromamba:1.5</text>
<text x="496" y="270" text-anchor="start" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">cached</text>
<rect x="60" y="284" width="420" height="26" rx="5" fill="#FFFFFF" stroke="#D3D8CE" stroke-width="1.4"/>
<text x="72" y="302" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#1C2421" font-weight="normal">COPY  environment.yml .</text>
<text x="496" y="302" text-anchor="start" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">cached</text>
<rect x="60" y="316" width="420" height="26" rx="5" fill="#FFFFFF" stroke="#C2703C" stroke-width="1.4"/>
<text x="72" y="334" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#1C2421" font-weight="normal">RUN   micromamba install -y -f environment.yml</text>
<text x="496" y="334" text-anchor="start" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">the slow one</text>
<rect x="60" y="348" width="420" height="26" rx="5" fill="#FFFFFF" stroke="#2E5878" stroke-width="1.4"/>
<text x="72" y="366" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#1C2421" font-weight="normal">COPY  src/ /app/src</text>
<text x="496" y="366" text-anchor="start" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">changes every commit</text>
<text x="60" y="396" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#6E7873" font-weight="normal">Put what changes least at the top. Copying src/ before installing means every edit</text>
<text x="60" y="412" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#C2703C" font-weight="normal">re-runs the install.</text>
</svg>
