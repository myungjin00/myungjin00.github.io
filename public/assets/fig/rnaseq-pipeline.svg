<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" role="img" aria-label="RNA-seq preprocessing pipeline">
<defs>
<marker id="ar0" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#D3D8CE"/></marker>
<marker id="ar1" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#1E4A39"/></marker>
<marker id="ar2" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#C2703C"/></marker>
</defs>
<text x="18" y="22" text-anchor="start" font-family="ui-monospace,monospace" font-size="11" fill="#6E7873" font-weight="normal">from FASTQ to a count matrix</text>
<rect x="30" y="56" width="112" height="54" rx="5" fill="#F7F7F3" stroke="#1E4A39" stroke-width="1.4"/>
<text x="86.0" y="84" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1C2421" font-weight="500">FASTQ</text>
<text x="86.0" y="126" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">raw reads + quality</text>
<line x1="144" y1="83" x2="164" y2="83" stroke="#D3D8CE" stroke-width="1.3" marker-end="url(#ar0)"/>
<rect x="166" y="56" width="112" height="54" rx="5" fill="#FFFFFF" stroke="#D3D8CE" stroke-width="1.4"/>
<text x="222.0" y="84" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1C2421" font-weight="500">QC</text>
<text x="222.0" y="126" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">FastQC &#8594; MultiQC</text>
<line x1="280" y1="83" x2="300" y2="83" stroke="#D3D8CE" stroke-width="1.3" marker-end="url(#ar0)"/>
<rect x="302" y="56" width="112" height="54" rx="5" fill="#FFFFFF" stroke="#D3D8CE" stroke-width="1.4"/>
<text x="358.0" y="84" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1C2421" font-weight="500">trim</text>
<text x="358.0" y="126" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">fastp / Trim Galore</text>
<line x1="416" y1="83" x2="436" y2="83" stroke="#D3D8CE" stroke-width="1.3" marker-end="url(#ar0)"/>
<rect x="438" y="56" width="112" height="54" rx="5" fill="#F7F7F3" stroke="#2E5878" stroke-width="1.4"/>
<text x="494.0" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#1C2421" font-weight="500">align or</text>
<text x="494.0" y="92" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#1C2421" font-weight="500">quantify</text>
<text x="494.0" y="126" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">STAR / salmon</text>
<line x1="552" y1="83" x2="572" y2="83" stroke="#D3D8CE" stroke-width="1.3" marker-end="url(#ar0)"/>
<rect x="574" y="56" width="112" height="54" rx="5" fill="#F7F7F3" stroke="#C2703C" stroke-width="1.4"/>
<text x="630.0" y="84" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1C2421" font-weight="500">counts</text>
<text x="630.0" y="126" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal">gene &#215; sample</text>
<rect x="30" y="152" width="600" height="34" rx="5" fill="#F7F7F3" stroke="#C2703C" stroke-width="1.4"/>
<text x="44" y="174" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#C2703C" font-weight="normal">reference genome + annotation &#8212; GENCODE / Ensembl, and the VERSION is part of your method</text>
<line x1="336" y1="148" x2="336" y2="120" stroke="#C2703C" stroke-width="1.3" marker-end="url(#ar2)"/>
<text x="30" y="214" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#6E7873" font-weight="normal">Then: counts &#8594; DESeq2. Everything above this line is engineering; everything below is statistics.</text>
</svg>
