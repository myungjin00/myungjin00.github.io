<text x="18" y="244" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#6E7873" font-weight="normal">On a directory, x means &#8220;can enter&#8221;, and w on the directory &#8212; not the file &#8212; is what lets you delete.</text>
