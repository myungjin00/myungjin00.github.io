<text x="88" y="201" text-anchor="start" font-family="ui-monospace,monospace" font-size="11" fill="#1C2421" font-weight="normal">chmod 754 train.sh   &#8801;   rwx  r-x  r--</text>
<text x="392" y="194" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#C2703C" font-weight="normal">7 = 4+2+1   you can read, write, run it</text>
