<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 352" role="img" aria-label="GEO accession hierarchy">
<defs>
<marker id="ar0" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#D3D8CE"/></marker>
<marker id="ar1" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#1E4A39"/></marker>
<marker id="ar2" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#C2703C"/></marker>
</defs>
<text x="18" y="22" text-anchor="start" font-family="ui-monospace,monospace" font-size="11" fill="#6E7873" font-weight="normal">what a GEO accession actually points at</text>
<rect x="40" y="48" width="260" height="42" rx="5" fill="#F7F7F3" stroke="#1E4A39" stroke-width="1.4"/>
<text x="170" y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1C2421" font-weight="500">GSE123456</text>
<text x="170" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#6E7873" font-weight="normal">series &#8212; one study</text>
<text x="320" y="74" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#1E4A39" font-weight="normal">the number in a paper</text>
<line x1="170" y1="90" x2="170" y2="106" stroke="#D3D8CE" stroke-width="1.3" marker-end="url(#ar0)"/>
<rect x="40" y="110" width="260" height="42" rx="5" fill="#F7F7F3" stroke="#2E5878" stroke-width="1.4"/>
<text x="170" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1C2421" font-weight="500">GSM...  GSM...  GSM...</text>
<text x="170" y="144" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#6E7873" font-weight="normal">samples &#8212; one per library</text>
<text x="320" y="136" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#2E5878" font-weight="normal">metadata lives here</text>
<line x1="170" y1="152" x2="170" y2="168" stroke="#D3D8CE" stroke-width="1.3" marker-end="url(#ar0)"/>
<rect x="40" y="172" width="260" height="42" rx="5" fill="#F7F7F3" stroke="#6E7873" stroke-width="1.4"/>
<text x="170" y="192" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1C2421" font-weight="500">GPL...</text>
<text x="170" y="206" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#6E7873" font-weight="normal">platform &#8212; the instrument</text>
<line x1="170" y1="214" x2="170" y2="230" stroke="#D3D8CE" stroke-width="1.3" marker-end="url(#ar0)"/>
<rect x="40" y="234" width="260" height="42" rx="5" fill="#F7F7F3" stroke="#C2703C" stroke-width="1.4"/>
<text x="170" y="254" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1C2421" font-weight="500">SRP / SRR...</text>
<text x="170" y="268" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#6E7873" font-weight="normal">the raw reads, in SRA</text>
<text x="320" y="260" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#C2703C" font-weight="normal">FASTQ is downloaded from here</text>
<text x="18" y="322" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#6E7873" font-weight="normal">A GSE often also carries a processed count matrix as a supplementary file.</text>
<text x="18" y="338" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#C2703C" font-weight="normal">Convenient, and produced by someone else's pipeline &#8212; different aligner, different annotation version.</text>
</svg>
