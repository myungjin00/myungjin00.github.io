<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-label="conda-environments">
<defs>
<marker id="ar0" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#D3D8CE"/></marker>
</defs>
<text x="18" y="22" text-anchor="start" font-family="ui-monospace,monospace" font-size="11" fill="#6E7873" font-weight="normal">one interpreter and one set of packages per project</text>
<rect x="30" y="46" width="190" height="64" rx="5" fill="#F7F7F3" stroke="#D3D8CE" stroke-width="1.4"/>
<text x="44" y="68" text-anchor="start" font-family="ui-monospace,monospace" font-size="11" fill="#D3D8CE" font-weight="500">base</text>
<text x="44" y="92" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#1C2421" font-weight="normal">python 3.12</text>
<text x="44" y="92" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#6E7873" font-weight="normal">conda itself &#8212; keep it empty</text>
<rect x="240" y="46" width="190" height="124" rx="5" fill="#F7F7F3" stroke="#1E4A39" stroke-width="1.4"/>
<text x="254" y="68" text-anchor="start" font-family="ui-monospace,monospace" font-size="11" fill="#1E4A39" font-weight="500">mol  (GPU work)</text>
<text x="254" y="92" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#1C2421" font-weight="normal">python 3.12</text>
<text x="254" y="112" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#1C2421" font-weight="normal">torch 2.8 + cu128</text>
<text x="254" y="132" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#1C2421" font-weight="normal">rdkit 2025.09</text>
<text x="254" y="152" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#1C2421" font-weight="normal">PyG 2.7</text>
<rect x="450" y="46" width="190" height="124" rx="5" fill="#F7F7F3" stroke="#2E5878" stroke-width="1.4"/>
<text x="464" y="68" text-anchor="start" font-family="ui-monospace,monospace" font-size="11" fill="#2E5878" font-weight="500">omics</text>
<text x="464" y="92" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#1C2421" font-weight="normal">python 3.11</text>
<text x="464" y="112" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#1C2421" font-weight="normal">scanpy 1.11</text>
<text x="464" y="132" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#1C2421" font-weight="normal">anndata 0.13</text>
<text x="464" y="152" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#1C2421" font-weight="normal">pydeseq2 0.5</text>
<rect x="30" y="200" width="610" height="36" rx="5" fill="#FFFFFF" stroke="#D3D8CE" stroke-width="1.4"/>
<text x="44" y="223" text-anchor="start" font-family="ui-monospace,monospace" font-size="10.5" fill="#6E7873" font-weight="normal">the machine: one NVIDIA driver, one filesystem, many environments</text>
<line x1="125" y1="180" x2="125" y2="198" stroke="#D3D8CE" stroke-width="1.2"/>
<line x1="335" y1="174" x2="335" y2="198" stroke="#D3D8CE" stroke-width="1.2"/>
<line x1="545" y1="174" x2="545" y2="198" stroke="#D3D8CE" stroke-width="1.2"/>
<text x="18" y="266" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#6E7873" font-weight="normal">numpy 1.26 and numpy 2.1 can both exist, because neither of them is installed globally.</text>
<text x="18" y="284" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#C2703C" font-weight="normal">conda can also install the non-Python half &#8212; CUDA, compilers, samtools, R. venv and uv cannot.</text>
</svg>
