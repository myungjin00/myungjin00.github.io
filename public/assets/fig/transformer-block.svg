<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 318" role="img" aria-label="transformer-block">
<defs>
<marker id="ar0" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#D3D8CE"/></marker>
<marker id="ar1" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#1E4A39"/></marker>
<marker id="ar2" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#C2703C"/></marker>
<marker id="ar3" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#2E5878"/></marker>
</defs>
<text x="18" y="22" text-anchor="start" font-family="ui-monospace,monospace" font-size="11" fill="#6E7873" font-weight="normal">one transformer block &#8212; attention is only half of it</text>
<rect x="60" y="52" width="260" height="38" rx="5" fill="#F7F7F3" stroke="#1E4A39" stroke-width="1.4"/>
<text x="190" y="75" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#1C2421" font-weight="500">multi-head attention</text>
<text x="336" y="75" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#6E7873" font-weight="normal">each head learns a different relation</text>
<rect x="60" y="108" width="260" height="38" rx="5" fill="#FFFFFF" stroke="#D3D8CE" stroke-width="1.4"/>
<text x="190" y="131" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#1C2421" font-weight="500">add &amp; norm</text>
<text x="336" y="131" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#6E7873" font-weight="normal">residual + layer norm</text>
<rect x="60" y="164" width="260" height="38" rx="5" fill="#F7F7F3" stroke="#C2703C" stroke-width="1.4"/>
<text x="190" y="187" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#1C2421" font-weight="500">feed-forward network (FFN)</text>
<text x="336" y="187" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#6E7873" font-weight="normal">per position: Linear &#8594; GELU &#8594; Linear, usually 4&#215; wider</text>
<rect x="60" y="220" width="260" height="38" rx="5" fill="#FFFFFF" stroke="#D3D8CE" stroke-width="1.4"/>
<text x="190" y="243" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#1C2421" font-weight="500">add &amp; norm</text>
<text x="336" y="243" text-anchor="start" font-family="ui-monospace,monospace" font-size="9.5" fill="#6E7873" font-weight="normal">residual + layer norm</text>
<line x1="190" y1="90" x2="190" y2="106" stroke="#D3D8CE" stroke-width="1.3" marker-end="url(#ar0)"/>
<line x1="190" y1="146" x2="190" y2="162" stroke="#D3D8CE" stroke-width="1.3" marker-end="url(#ar0)"/>
<line x1="190" y1="202" x2="190" y2="218" stroke="#D3D8CE" stroke-width="1.3" marker-end="url(#ar0)"/>
<text x="60" y="284" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#6E7873" font-weight="normal">in:  one vector per position</text>
<line x1="190" y1="38" x2="190" y2="50" stroke="#D3D8CE" stroke-width="1.3" marker-end="url(#ar0)"/>
<text x="190" y="34" text-anchor="start" font-family="ui-monospace,monospace" font-size="9" fill="#6E7873" font-weight="normal"></text>
<text x="60" y="302" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#6E7873" font-weight="normal">out: one vector per position, same shape &#8212; so you can stack it</text>
<text x="400" y="100" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#1E4A39" font-weight="normal">attention mixes across positions</text>
<text x="400" y="118" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#C2703C" font-weight="normal">the FFN transforms each position on its own</text>
<text x="400" y="136" text-anchor="start" font-family="ui-monospace,monospace" font-size="10" fill="#6E7873" font-weight="normal">one does the talking, the other does the thinking</text>
</svg>
